<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrackMyKW - Scout Extension</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #121214;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #1a1a1e;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            width: 340px;
            text-align: center;
            border: 1px solid #2a2a30;
        }
        h1 {
            margin: 0 0 10px 0;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        .accent-text {
            color: #ff3344;
        }
        p {
            color: #a1a1aa;
            font-size: 15px;
            line-height: 1.5;
            margin-bottom: 30px;
        }
        .btn {
            display: block;
            background: #ff3344;
            color: #ffffff;
            text-decoration: none;
            padding: 14px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 15px;
            transition: background 0.2s ease;
            box-shadow: 0 4px 12px rgba(255, 51, 68, 0.2);
        }
        .btn:hover {
            background: #e02435;
        }
        .footer-note {
            display: block;
            margin-top: 25px;
            font-size: 12px;
            color: #52525b;
        }
    </style>
</head>
<body>

<div class="card">
    <h1>Scout<span class="accent-text">.</span></h1>
    <p>Target rank & sales tracker browser extension. Track keyword history and sharpen your sales estimates instantly.</p>
    
    <!-- This button will be your download link -->
    <a href="./scout-extension.zip" download="scout-extension.zip" class="btn">Download Chrome Extension</a>

    <a href="dashboard.html" style="display: block; margin-top: 15px; color: #a1a1aa; text-decoration: none; font-size: 14px;">📊 Open Profile Dashboard</a>

    
    <span class="footer-note">TrackMyKW — Build 28 Portal</span>
</div>

</body>
</html>
