<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrackMyKW - Scout Portal</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #121214;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #1a1a1e;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            width: 340px;
            text-align: center;
            border: 1px solid #2a2a30;
        }
        h1 {
            margin: 0 0 10px 0;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        .accent-text {
            color: #ff3344;
        }
        p {
            color: #a1a1aa;
            font-size: 15px;
            line-height: 1.5;
            margin-bottom: 30px;
        }
        .btn {
            display: block;
            width: 100%;
            background: #ff3344;
            color: #ffffff;
            text-decoration: none;
            padding: 14px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 15px;
            transition: background 0.2s ease;
            box-shadow: 0 4px 12px rgba(255, 51, 68, 0.2);
            border: none;
            cursor: pointer;
            box-sizing: border-box;
        }
        .btn:hover {
            background: #e02435;
        }
        .btn-secondary {
            display: block;
            margin-top: 15px;
            color: #a1a1aa;
            text-decoration: none;
            font-size: 14px;
        }
        .btn-secondary:hover {
            color: #ffffff;
        }
        .footer-note {
            display: block;
            margin-top: 25px;
            font-size: 12px;
            color: #52525b;
        }
        dialog {
            background: #1a1a1e;
            color: #ffffff;
            border: 1px solid #2a2a30;
            border-radius: 12px;
            padding: 24px;
            width: 300px;
        }
        dialog::backdrop {
            background: rgba(0, 0, 0, 0.6);
        }
        dialog input {
            width: 100%;
            padding: 10px;
            margin: 8px 0 16px 0;
            border-radius: 6px;
            border: 1px solid #2a2a30;
            background: #121214;
            color: #fff;
            box-sizing: border-box;
        }
        .dialog-actions {
            display: flex;
            gap: 10px;
        }
    </style>
</head>
<body>

<div class="card">
    <h1>Scout<span class="accent-text">.</span></h1>
    <p>Target rank & sales tracker portal. Track keyword history and sharpen your sales estimates instantly.</p>
    
    <!-- Demo Login Action -->
    <button class="btn" onclick="openLoginModal()">Demo Login</button>

    <a href="dashboard.html" class="btn-secondary">📊 Open Profile Dashboard</a>

    <span class="footer-note">TrackMyKW — Build 28 Portal</span>
</div>

<!-- Demo Login Dialog -->
<dialog id="loginModal">
    <h3 style="margin-top: 0; margin-bottom: 15px;">Demo Access Sign In</h3>
    <label style="font-size: 13px; color: #a1a1aa;">Email</label>
    <input type="email" id="demoEmail" value="demo@trackmykw.com" placeholder="email@example.com">
    
    <label style="font-size: 13px; color: #a1a1aa;">Password</label>
    <input type="password" id="demoPassword" value="demopassword" placeholder="Password">
    
    <div class="dialog-actions">
        <button class="btn" onclick="saveDemoInfo()">Sign In</button>
        <button class="btn" style="background: #2a2a30; box-shadow: none;" onclick="closeLoginModal()">Cancel</button>
    </div>
</dialog>

<script>
function openLoginModal() {
    document.getElementById("loginModal").showModal();
}

function closeLoginModal() {
    document.getElementById("loginModal").close();
}

function saveDemoInfo() {
    const email = document.getElementById("demoEmail").value;
    if (email) {
        localStorage.setItem("scout_user_logged_in", "true");
        localStorage.setItem("scout_demo_email", email);
        alert("Logged in as " + email);
        closeLoginModal();
        window.location.href = "dashboard.html";
    }
}
</script>

</body>
</html>
