<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scout — Target rank &amp; sales tracker</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#F5F6F4;
  --surface:#FFFFFF;
  --surface-2:#EEF0ED;
  --ink:#1A1C20;
  --muted:#626A75;
  --line:#E2E4E0;
  --brand:#C4122F;
  --up:#188A57;
  --down:#C75032;
  --chip1:#C4122F;--chip2:#2B6CB0;--chip3:#188A57;--chip4:#B7791F;--chip5:#6B46C1;--chip6:#2C7A7B;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141518;
    --surface:#1C1E22;
    --surface-2:#24262B;
    --ink:#ECEDEF;
    --muted:#9AA1AB;
    --line:#2E3137;
    --brand:#E8384F;
    --up:#3FB380;
    --down:#E07856;
  }
}
:root[data-theme="dark"]{
  --bg:#141518;
  --surface:#1C1E22;
  --surface-2:#24262B;
  --ink:#ECEDEF;
  --muted:#9AA1AB;
  --line:#2E3137;
  --brand:#E8384F;
  --up:#3FB380;
  --down:#E07856;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'Archivo',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  font-size:15px;
  line-height:1.5;
}
.wrap{max-width:1060px;margin:0 auto;padding:0 20px 64px}
header{
  display:flex;align-items:center;gap:12px;
  padding:22px 0 18px;border-bottom:1px solid var(--line);
  margin-bottom:24px;flex-wrap:wrap;
}
.mark{width:26px;height:26px;flex:none}
h1{font-size:19px;font-weight:700;letter-spacing:-.01em}
h1 span{color:var(--muted);font-weight:500}
.spacer{flex:1}
.mode-pill{
  font-size:12.5px;color:var(--muted);
  border:1px solid var(--line);border-radius:99px;
  padding:3px 10px;background:var(--surface);
}
button{
  font-family:inherit;font-size:14px;font-weight:600;
  border:1px solid var(--line);background:var(--surface);color:var(--ink);
  border-radius:8px;padding:8px 14px;cursor:pointer;
}
button:hover{background:var(--surface-2)}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{
  outline:2px solid var(--brand);outline-offset:2px;
}
button.primary{background:var(--brand);border-color:var(--brand);color:#fff}
button.primary:hover{filter:brightness(1.08)}
button.ghost{border-color:transparent;background:transparent;color:var(--muted)}
button.ghost:hover{color:var(--ink);background:var(--surface-2)}
button.danger{color:var(--down)}
input[type=text],input[type=number],input[type=email],input[type=password],textarea{
  font-family:inherit;font-size:14px;color:var(--ink);
  background:var(--surface);border:1px solid var(--line);
  border-radius:8px;padding:8px 12px;width:100%;
}
textarea{min-height:170px;font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;font-size:12.5px;line-height:1.45}
.toolbar{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap;align-items:center}
.toolbar input[type=text]{max-width:320px}
.num{font-variant-numeric:tabular-nums}
.tablebox{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:640px}
th{
  text-align:left;font-size:12.5px;font-weight:600;color:var(--muted);
  padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap;
}
th.r,td.r{text-align:right}
td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr.kw{cursor:pointer}
tbody tr.kw:hover{background:var(--surface-2)}
.kwname{font-weight:600}
.sub{font-size:12.5px;color:var(--muted)}
.delta{font-size:12.5px;font-weight:600;margin-left:6px}
.delta.up{color:var(--up)}
.delta.down{color:var(--down)}
.delta.flat{color:var(--muted)}
.empty{
  background:var(--surface);border:1px dashed var(--line);border-radius:12px;
  padding:44px 28px;text-align:center;
}
.empty h2{font-size:17px;font-weight:700;margin-bottom:8px}
.empty p{color:var(--muted);max-width:52ch;margin:0 auto 18px}
.empty .btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.crumb{margin-bottom:14px}
.detail-head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:4px}
.detail-head h2{font-size:22px;font-weight:700}
.detail-meta{color:var(--muted);font-size:13.5px;margin-bottom:16px}
.detail-meta b{color:var(--ink);font-weight:600}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:20px}
.panel h3{font-size:14px;font-weight:700;margin-bottom:12px}
.chartbox{overflow-x:auto}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:12px}
.legend .item{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted)}
.legend .dot{width:9px;height:9px;border-radius:99px;flex:none}
dialog{
  border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);
  padding:22px;max-width:560px;width:calc(100% - 40px);
}
dialog::backdrop{background:rgba(10,10,12,.45)}
dialog h3{font-size:16px;font-weight:700;margin-bottom:6px}
dialog p{font-size:13.5px;color:var(--muted);margin-bottom:12px}
dialog .row{display:flex;gap:10px;justify-content:flex-end;margin-top:14px}
dialog label{font-size:13px;font-weight:600;display:block;margin:10px 0 5px}
.note{font-size:12.5px;color:var(--muted);margin-top:10px}
.tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.tab{border-radius:99px;padding:7px 16px;color:var(--muted);background:transparent;border:1px solid var(--line);font-weight:600}
.tab:hover{background:var(--surface)}
.tab.on{color:var(--ink);background:var(--surface);border-color:var(--ink)}
.tab .cnt{color:var(--brand);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface-2);border-radius:99px;padding:4px 6px 4px 12px;font-size:13px}
.chip.brand{border-color:var(--brand);background:transparent;font-weight:600}
.chipx{border:none;background:transparent;color:var(--muted);cursor:pointer;font-size:14px;padding:2px 6px;border-radius:99px;margin:0}
.chipx:hover{color:var(--down);background:var(--surface)}
footer{margin-top:26px;color:var(--muted);font-size:12.5px;max-width:78ch}
.toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%);
  background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;
  font-size:13.5px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .18s;
  max-width:calc(100% - 40px);
}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <svg class="mark" viewBox="0 0 26 26" aria-hidden="true">
      <circle cx="13" cy="13" r="12" fill="none" stroke="var(--brand)" stroke-width="2.6"/>
      <circle cx="13" cy="13" r="5.2" fill="var(--brand)"/>
    </svg>
    <h1>Scout <span>· Target rank &amp; sales tracker</span></h1>
    <div class="spacer"></div>
    <span class="mode-pill" id="modePill">Local Storage</span>
    <button class="ghost" id="loginBtn" onclick="openLoginModal()">Sign In</button>
    <button class="ghost" id="settingsBtn">Settings</button>
  </header>

  <main id="app" aria-live="polite"></main>

  <footer>
    Sales figures are modeled from review velocity and search volume is a proxy, not retailer-reported data.
  </footer>
</div>

<!-- Login / Signup Dialog Modal -->
<dialog id="loginModal">
  <h3>Sign In / Sign Up</h3>
  <label for="authEmail">Email</label>
  <input type="email" id="authEmail" placeholder="your@email.com" required />
  
  <label for="authPassword">Password</label>
  <input type="password" id="authPassword" placeholder="••••••••" required />
  
  <div id="authError" style="color: var(--down); font-size: 13px; margin-top: 8px; display: none;"></div>
  
  <div class="row" style="margin-top: 18px;">
    <button type="button" onclick="closeLoginModal()">Cancel</button>
    <button type="button" onclick="handleSignUp()">Sign Up</button>
    <button type="button" class="primary" onclick="handleSignIn()">Sign In</button>
  </div>
</dialog>

<dialog id="importDlg">
  <h3>Import a snapshot</h3>
  <p>Paste JSON snapshot data here.</p>
  <textarea id="importText" spellcheck="false" placeholder='{"keyword":"yoga mat","capturedAt":"2026-09-16T08:00:00Z","results":[]}'></textarea>
  <div class="row">
    <button id="importCancel">Cancel</button>
    <button class="primary" id="importGo">Import</button>
  </div>
</dialog>

<dialog id="settingsDlg">
  <h3>Settings</h3>
  <label for="reviewRate">Review rate (% of buyers who leave a review)</label>
  <input type="number" id="reviewRate" min="0.1" max="20" step="0.1" value="2">
  <div class="row">
    <button id="settingsCancel">Cancel</button>
    <button class="primary" id="settingsSave">Save</button>
  </div>
</dialog>

<div class="toast" id="toast" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
"use strict";

const SUPABASE_URL = 'https://fzmdlkdtreeiubnqevgj.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_Cc_D7rfUq81P-iJbK9niDg_erT7IyT8';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

async function checkUserSession() {
  const { data: { session } } = await supabase.auth.getSession();
  const loginBtn = document.getElementById("loginBtn");
  if (session || localStorage.getItem("scout_user_logged_in") === "true") {
    if (loginBtn) {
      loginBtn.textContent = "Sign Out";
      loginBtn.onclick = handleSignOut;
    }
  } else {
    if (loginBtn) {
      loginBtn.textContent = "Sign In";
      loginBtn.onclick = openLoginModal;
    }
  }
}

checkUserSession();

function openLoginModal() {
  document.getElementById("authError").style.display = "none";
  document.getElementById("loginModal").showModal();
}

function closeLoginModal() {
  document.getElementById("loginModal").close();
}

async function handleSignIn() {
  const email = document.getElementById("authEmail").value;
  const password = document.getElementById("authPassword").value;
  const errorEl = document.getElementById("authError");

  const { data, error } = await supabase.auth.signInWithPassword({ email, password });

  if (error) {
    errorEl.textContent = error.message;
    errorEl.style.display = "block";
  } else {
    localStorage.setItem("scout_user_logged_in", "true");
    closeLoginModal();
    checkUserSession();
    toast("Successfully signed in!");
  }
}

async function handleSignUp() {
  const email = document.getElementById("authEmail").value;
  const password = document.getElementById("authPassword").value;
  const errorEl = document.getElementById("authError");

  const { data, error } = await supabase.auth.signUp({ email, password });

  if (error) {
    errorEl.textContent = error.message;
    errorEl.style.display = "block";
  } else {
    closeLoginModal();
    toast("Account created! Check your email to confirm.");
  }
}

async function handleSignOut() {
  await supabase.auth.signOut();
  localStorage.setItem("scout_user_logged_in", "false");
  checkUserSession();
  toast("Signed out successfully.");
}

function toast(msg){
  const t = document.getElementById("toast"); 
  t.textContent = msg; 
  t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"), 2600);
}

document.getElementById("settingsBtn").addEventListener("click", () => document.getElementById("settingsDlg").showModal());
document.getElementById("settingsCancel").addEventListener("click", () => document.getElementById("settingsDlg").close());
</script>
</body>
</html>
